<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月詠の占い</title>
<meta name="description" content="AI占い師・月詠によるタロットと12星座占い。今日の1枚は無料。">
<style>
  :root { --bg:#14112b; --card:#1f1b40; --text:#eee9ff; --muted:#a79fd0; --accent:#e7c46a; --line:#3a3470; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0,#2b2460,var(--bg) 60%); color:var(--text);
         font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.8; min-height:100vh; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  h1 { text-align:center; font-size:1.6rem; letter-spacing:.2em; margin:8px 0 0; color:var(--accent); }
  .sub { text-align:center; color:var(--muted); font-size:.9rem; margin:0 0 20px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:16px 0; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  button { background:var(--accent); color:#1b1636; border:0; border-radius:999px; padding:11px 20px;
           font-weight:700; font-size:1rem; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  input, textarea { width:100%; background:#141130; color:var(--text); border:1px solid var(--line);
                    border-radius:10px; padding:10px; font-size:1rem; font-family:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .cards { display:flex; gap:10px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap; }
  .tcard { width:92px; height:140px; border-radius:10px; border:1px solid var(--accent);
           background:linear-gradient(160deg,#3b2f7a,#1a1540); display:flex; flex-direction:column;
           align-items:center; justify-content:center; text-align:center; font-size:.8rem; padding:6px;
           animation:flip .6s ease both; }
  .tcard b { font-size:1rem; color:var(--accent); }
  .tcard.rev b { transform:rotate(180deg); }
  @keyframes flip { from { transform:rotateY(90deg); opacity:0 } to { transform:none; opacity:1 } }
  .result { white-space:pre-wrap; margin-top:12px; }
  .note { color:var(--muted); font-size:.8rem; }
  .premium { border-color:var(--accent); }
  footer { text-align:center; font-size:.8rem; color:var(--muted); }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>月詠の占い</h1>
  <p class="sub">AI占い師・月詠があなたの今日を読み解きます</p>

  <section>
    <h2>🌙 12星座の今日の運勢（無料）</h2>
    <input id="bd" placeholder="誕生日（例: 3/21）" inputmode="numeric" autocomplete="bday">
    <div class="row"><button id="horoBtn">占う</button></div>
    <div id="horo" class="result"></div>
  </section>

  <section>
    <h2>🔮 今日のタロット1枚（無料・1日1回）</h2>
    <div class="row"><button id="tarot1">カードを引く</button></div>
    <div id="cards1" class="cards"></div>
    <div id="tarotRes1" class="result"></div>
  </section>

  <section class="premium">
    <h2>✨ プレミアム鑑定</h2>
    <p class="note" id="plan">過去・現在・未来の3枚引きと、あなたの悩みに合わせた個別鑑定。</p>
    <textarea id="q" maxlength="500" placeholder="相談したいこと（例: 転職するか迷っています）"></textarea>
    <div class="row">
      <button id="tarot3">3枚で鑑定する</button>
      <button id="buy" class="ghost" hidden>プレミアムに登録</button>
    </div>
    <div id="cards3" class="cards"></div>
    <div id="tarotRes3" class="result"></div>
  </section>

  <footer>
    <p>占いは娯楽です。医療・法律・お金の判断は専門家にご相談ください。</p>
    <a href="/legal">特定商取引法に基づく表記</a>
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
let me = { premium:false, billing:false };

async function post(url, data) {
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(data||{}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "エラーが発生しました");
  return j;
}

function showCards(el, cards) {
  el.replaceChildren(...cards.map((c, i) => {
    const d = document.createElement("div");
    d.className = "tcard" + (c.reversed ? " rev" : "");
    d.style.animationDelay = (i * 0.25) + "s";
    const pos = document.createElement("span"); pos.textContent = c.position;
    const name = document.createElement("b"); name.textContent = c.name;
    const dir = document.createElement("span"); dir.textContent = c.reversed ? "逆位置" : "正位置";
    d.append(pos, name, dir);
    return d;
  }));
}

async function run(btn, fn) {
  btn.disabled = true; const label = btn.textContent; btn.textContent = "月詠が読み解いています…";
  try { await fn(); } catch (e) { alert(e.message); } finally { btn.disabled = false; btn.textContent = label; }
}

async function loadMe() {
  me = await (await fetch("/api/me")).json();
  $("buy").hidden = me.premium || !me.billing;
  if (me.premium) $("plan").textContent = `プレミアム会員です。今日は ${me.used}/${me.limit} 回利用済み。`;
}

$("horoBtn").onclick = () => run($("horoBtn"), async () => {
  const j = await post("/api/horoscope", { birthday: $("bd").value });
  $("horo").textContent = j.text;
  try { localStorage.setItem("bd", $("bd").value); } catch (_) {}
});

$("tarot1").onclick = () => run($("tarot1"), async () => {
  const j = await post("/api/tarot", { count: 1 });
  if (j.ok) showCards($("cards1"), j.cards);
  $("tarotRes1").textContent = j.text;
  loadMe();
});

$("tarot3").onclick = () => run($("tarot3"), async () => {
  const j = await post("/api/tarot", { count: 3, question: $("q").value });
  if (j.ok) showCards($("cards3"), j.cards);
  $("tarotRes3").textContent = j.text;
  loadMe();
});

$("buy").onclick = () => run($("buy"), async () => {
  const j = await post("/billing/checkout");
  location.href = j.url;
});

try { const v = localStorage.getItem("bd"); if (v) $("bd").value = v; } catch (_) {}
loadMe();
</script>
</body>
</html>
